user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
	# Including mimes types for images and stuff
		include /etc/nginx/mime.types;
		default_type application/octet-stream;


	server {

		# IPv4 adresses
		listen 443 ssl;
		# IPv6 adresses
		listen [::]:443 ssl;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_certificate /etc/nginx/cert/inception.crt;
		ssl_certificate_key /etc/nginx/tsl_key/inception.key;

		# Configuration du serveur Wordpress (root, index et server_name)
		root /var/www/html;
		# Localhost only stays here for purpose demo
		server_name  flverge.42.fr localhost;
		# Look for the index.php
		index index.php index.html index.htm;

		location / {
            try_files $uri $uri/ /index.php?$args;
        }

		# Configuration for handling PHP files
		location ~ \.php$ {
			# Pass the request to the FastCGI server running on wordpress:9000
			fastcgi_pass wordpress:9000; #! TURN BACK ON AFTER TESTING
			# Include the default FastCGI parameters
			include fastcgi_params;

			include snippets/fastcgi-php.conf;
			# Set the SCRIPT_FILENAME parameter to the path of the script
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		}

		location /static {
			alias /var/www/static_website;
			index index.html;
			try_files $uri $uri/ /index.html =404;
		}

		location /static/1_get_ok {
			alias /var/www/static_website/1_get_ok;
			autoindex on;
			autoindex_format html;
		}

		location /static/9_redirection_ok {
			return 301 https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExZmhub2hyYjQ5amFtZXFuMnp0dXZybHYwbXdwcGt5eDlpdnpsZDVpMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/R6gvnAxj2ISzJdbA63/giphy.gif;
		}

		location /static/10_surprise {
			return 301 https://rickroll.it/rickroll.mp4;
		}

		access_log /var/log/nginx/access.log;
		error_log /var/log/nginx/error.log;
	}
}