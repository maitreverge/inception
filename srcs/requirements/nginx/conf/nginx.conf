user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
	server {

		# IPv4 adresses
		listen 443 ssl;
		# IPv6 adresses
		listen [::]:443 ssl;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_certificate /etc/nginx/cert/inception.crt;
		ssl_certificate_key /etc/nginx/tsl_key/inception.key;

		# Configuration du serveur Wordpress (root, index et server_name)
		root /var/www/html;
		# Localhost only stays here for purpose demo
		server_name  flverge.42.fr localhost;
		# Look for the index.php
		index index.php index.html index.htm;

		location / {
            try_files $uri $uri/ /index.php?$args;
        }

		# Configuration for handling PHP files
		location ~ \.php$ {
			# Try to serve the file, if not found return 404
			# try_files $uri =404;
			# Pass the request to the FastCGI server running on wordpress:9000
			fastcgi_pass wordpress:9000;
			# Include the default FastCGI parameters
			include fastcgi_params;

			include snippets/fastcgi-php.conf;
			# Set the SCRIPT_FILENAME parameter to the path of the script
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		}

		location /static {

			root /var/www/static_website

			index index.html
		}

		access_log /var/log/nginx/access.log;
		error_log /var/log/nginx/error.log;
	}
}